name: Labs (Python)

on:
  push:
    branches: [main]
    paths:
      - "labs/**"
      - ".github/workflows/labs.yml"
  pull_request:
    paths:
      - "labs/**"
      - ".github/workflows/labs.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: labs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install labs
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run the lab suites
        # No API key is ever needed: every provider, judge and clock is faked.
        run: python -m pytest

